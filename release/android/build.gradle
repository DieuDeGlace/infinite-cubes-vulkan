plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'org.infinitecubes.vulkan'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'org.infinitecubes.vulkan'
        minSdk 33
        targetSdk 35
        versionCode 29
        versionName '0.28.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            // World generation and meshing are too slow for a phone without optimization.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
            // Windows limits paths to 260 characters, which the fetched dependencies exceed below a long checkout
            // path. CUBE_NATIVE_BUILD_DIR moves the native build to a short directory.
            def nativeBuildDirectory = System.getenv('CUBE_NATIVE_BUILD_DIR')
            if (nativeBuildDirectory) {
                buildStagingDirectory file(nativeBuildDirectory)
            }
        }
    }
}
